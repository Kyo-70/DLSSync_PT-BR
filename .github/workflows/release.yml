name: Release

on:
  push:
    tags:
      - "v1.7.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (must be v1.7.0)"
        required: true
        default: "v1.7.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-v1.7.0
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  resolve:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Select tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi
          if [ "$tag" != "v1.7.0" ]; then
            echo "Only the existing v1.7.0 tag is accepted; got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Resolve version and commit
        id: release
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse "$env:TAG^{commit}").Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $commit) {
            throw "Checkout HEAD $head does not match immutable tag commit $commit"
          }
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') {
            throw "Could not read [workspace.package].version from Cargo.toml"
          }
          $version = $Matches[1]
          if ($env:TAG -ne "v$version" -or $version -ne '1.7.0') {
            throw "Tag '$env:TAG' does not match workspace version '$version'"
          }
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $version) {
            throw "src-tauri/tauri.conf.json version '$tauriVersion' does not match Cargo owner '$version'"
          }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$env:TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-windows:
    name: Build Standard and NexusBuild from one commit
    needs: resolve
    runs-on: windows-latest
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Verify checkout identity
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_COMMIT) {
            throw "Build checkout $head does not match release commit $env:RELEASE_COMMIT"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize Standard updater key
        id: key
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for the Standard updater signature"
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'dlssync-updater.key'
          [IO.File]::WriteAllText($keyPath, $env:PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          "path=$keyPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Standard in isolated outputs
        shell: pwsh
        env:
          DLSSYNC_BUILD_COMMIT: ${{ needs.resolve.outputs.commit }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ steps.key.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DLSSYNC_DISTRIBUTION: standard
        run: |
          $ErrorActionPreference = 'Stop'
          $configDir = Join-Path $PWD 'target/channels/standard/config'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $overlay = @{
            build = @{
              beforeBuildCommand = 'pnpm --filter dlssync-frontend exec vite build --mode production --outDir dist-standard --emptyOutDir'
              frontendDist = '../frontend/dist-standard'
            }
          } | ConvertTo-Json -Depth 10
          $configPath = Join-Path $configDir 'tauri.conf.json'
          [IO.File]::WriteAllText($configPath, "$overlay`n", [Text.UTF8Encoding]::new($false))
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target/channels/standard'
          # Invoke the pinned CLI directly. Package-manager exec wrappers can consume the Cargo
          # separator, and `tauri build` has no --no-default-features option of its own, so that
          # flag must reach Cargo after the separator.
          $tauriCli = Join-Path $PWD 'node_modules/@tauri-apps/cli/tauri.js'
          if (-not (Test-Path -LiteralPath $tauriCli -PathType Leaf)) {
            throw "Pinned Tauri CLI missing at $tauriCli"
          }
          node $tauriCli build --config $configPath --target x86_64-pc-windows-msvc --features standard --bundles nsis,msi -- --no-default-features --locked

      - name: Verify Standard source contract
        run: cargo xtask verify-release --channel standard

      - name: Build NexusBuild in isolated outputs
        shell: pwsh
        env:
          DLSSYNC_BUILD_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: node scripts/build-nexus.mjs

      - name: Verify Nexus derived build contract
        run: node scripts/verify-nexus-build.mjs

      - name: Stage exact unsigned artifacts for Authenticode
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'target/phase15/unsigned'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $files = [ordered]@{
            'DLSSync.exe' = 'target/channels/standard/x86_64-pc-windows-msvc/release/dlssync.exe'
            "DLSSync_$env:VERSION`_x64-setup.exe" = "target/channels/standard/x86_64-pc-windows-msvc/release/bundle/nsis/DLSSync_$env:VERSION`_x64-setup.exe"
            "DLSSync_$env:VERSION`_x64_en-US.msi" = "target/channels/standard/x86_64-pc-windows-msvc/release/bundle/msi/DLSSync_$env:VERSION`_x64_en-US.msi"
            'NexusBuild-DLSSync.exe' = 'target/channels/nexus/x86_64-pc-windows-msvc/release/dlssync.exe'
            "NexusBuild-DLSSync_$env:VERSION`_x64-setup.exe" = "target/channels/nexus/x86_64-pc-windows-msvc/release/bundle/nsis/NexusBuild-DLSSync_$env:VERSION`_x64-setup.exe"
            "NexusBuild-DLSSync_$env:VERSION`_x64_en-US.msi" = "target/channels/nexus/x86_64-pc-windows-msvc/release/bundle/msi/NexusBuild-DLSSync_$env:VERSION`_x64_en-US.msi"
          }
          foreach ($entry in $files.GetEnumerator()) {
            $source = Join-Path $PWD $entry.Value
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Exact build artifact missing: $($entry.Value)"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $stage $entry.Key)
          }

      - name: Upload exact unsigned artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlssync-windows-unsigned
          path: target/phase15/unsigned/
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Authenticode sign exact Windows artifacts
    needs: [resolve, build-windows]
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require SignPath
        shell: bash
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$SIGNPATH_ENABLED" != "true" ]; then
            echo "Authenticode signature missing or invalid for exact artifact DLSSync_${VERSION}_x64-setup.exe: SignPath is not enabled" >&2
            exit 1
          fi

      - name: Download unsigned artifact
        id: download
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dlssync-windows-unsigned
          path: unsigned

      - name: Submit exact set to SignPath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: dlssync
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.download.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload Authenticode-signed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlssync-windows-signed
          path: signed/
          if-no-files-found: error

  verify-signatures:
    name: Verify exact Authenticode signatures
    needs: [resolve, sign-windows]
    if: needs.sign-windows.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Download signed artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dlssync-windows-signed
          path: signed

      - name: Verify and flatten exact signed files
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(
            'DLSSync.exe',
            "DLSSync_$env:VERSION`_x64-setup.exe",
            "DLSSync_$env:VERSION`_x64_en-US.msi",
            'NexusBuild-DLSSync.exe',
            "NexusBuild-DLSSync_$env:VERSION`_x64-setup.exe",
            "NexusBuild-DLSSync_$env:VERSION`_x64_en-US.msi"
          )
          $flat = Join-Path $PWD 'signed-flat'
          New-Item -ItemType Directory -Force -Path $flat | Out-Null
          foreach ($name in $names) {
            $matches = @(Get-ChildItem signed -Recurse -File | Where-Object Name -CEQ $name)
            if ($matches.Count -ne 1) {
              throw "Authenticode signature missing or invalid for exact artifact ${name}: expected one signed file, found $($matches.Count)"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode signature missing or invalid for exact artifact ${name}: status $($signature.Status)"
            }
            Copy-Item -LiteralPath $matches[0].FullName -Destination (Join-Path $flat $name)
          }
          @{ authenticode = 'signed'; verified_at = (Get-Date).ToUniversalTime().ToString('o') } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $flat 'AUTHENTICODE-STATE.json') -Encoding utf8

      - name: Upload verified signed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlssync-windows-release-input
          path: signed-flat/
          if-no-files-found: error

  stage-unsigned:
    name: Record the unsigned Authenticode state of exact Windows artifacts
    needs: [resolve, build-windows]
    if: vars.SIGNPATH_ENABLED != 'true'
    runs-on: windows-latest
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dlssync-windows-unsigned
          path: unsigned

      - name: Read and record the real Authenticode state of every exact file
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(
            'DLSSync.exe',
            "DLSSync_$env:VERSION`_x64-setup.exe",
            "DLSSync_$env:VERSION`_x64_en-US.msi",
            'NexusBuild-DLSSync.exe',
            "NexusBuild-DLSSync_$env:VERSION`_x64-setup.exe",
            "NexusBuild-DLSSync_$env:VERSION`_x64_en-US.msi"
          )
          $flat = Join-Path $PWD 'release-input'
          New-Item -ItemType Directory -Force -Path $flat | Out-Null
          $states = @()
          foreach ($name in $names) {
            $found = @(Get-ChildItem unsigned -Recurse -File | Where-Object Name -CEQ $name)
            if ($found.Count -ne 1) {
              throw "Exact build artifact missing for the unsigned lane ${name}: expected one file, found $($found.Count)"
            }
            $status = (Get-AuthenticodeSignature -LiteralPath $found[0].FullName).Status
            if ($status -ne 'NotSigned') {
              throw "Unsigned lane refuses exact artifact ${name}: expected NotSigned, read $status. Set SIGNPATH_ENABLED=true to publish signed bytes."
            }
            $states += [ordered]@{ name = $name; authenticode = "$status" }
            Copy-Item -LiteralPath $found[0].FullName -Destination (Join-Path $flat $name)
          }
          @{ authenticode = 'unsigned'; reason = 'SIGNPATH_ENABLED is not true'; files = $states } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $flat 'AUTHENTICODE-STATE.json') -Encoding utf8

      - name: Upload unsigned release input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlssync-windows-release-input
          path: release-input/
          if-no-files-found: error

  publish:
    name: Verify and publish one resumable release
    needs: [resolve, build-windows, sign-windows, verify-signatures, stage-unsigned]
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.sign-windows.result != 'failure'
      && needs.verify-signatures.result != 'failure'
      && needs.stage-unsigned.result != 'failure'
      && (needs.verify-signatures.result == 'success' || needs.stage-unsigned.result == 'success')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - name: Install dependencies for Tauri updater signing
        run: pnpm install --frozen-lockfile

      - name: Download verified release input
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dlssync-windows-release-input
          path: signed

      - name: Resolve the recorded Authenticode state
        id: authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statePath = Join-Path $PWD 'signed/AUTHENTICODE-STATE.json'
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) {
            throw "Release input is missing AUTHENTICODE-STATE.json; refusing to describe the signature state"
          }
          $state = (Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json).authenticode
          if ($state -notin @('signed', 'unsigned')) {
            throw "Refusing publication: recorded Authenticode state '$state' is not a verified state"
          }
          "state=$state" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage exact packages and signed portable archives
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          foreach ($name in @(
            "DLSSync_$env:VERSION`_x64-setup.exe",
            "DLSSync_$env:VERSION`_x64_en-US.msi",
            "NexusBuild-DLSSync_$env:VERSION`_x64-setup.exe",
            "NexusBuild-DLSSync_$env:VERSION`_x64_en-US.msi"
          )) {
            $source = Join-Path $PWD "signed/$name"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Authenticode signature missing or invalid for exact artifact $name"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $release $name)
          }

          function New-Portable([string]$Channel, [string]$SourceName, [string]$OutputName) {
            $dir = Join-Path $env:RUNNER_TEMP "portable-$Channel"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $exeName = if ($Channel -eq 'standard') { 'DLSSync.exe' } else { 'NexusBuild-DLSSync.exe' }
            Copy-Item -LiteralPath (Join-Path $PWD "signed/$SourceName") -Destination (Join-Path $dir $exeName)
            Set-Content -LiteralPath (Join-Path $dir 'portable.flag') -Value 'DLSSync portable data boundary' -Encoding ascii
            Copy-Item -LiteralPath LICENSE -Destination (Join-Path $dir 'LICENSE')
            $instructions = @"
          DLSSync $Channel portable build
          Version: $env:VERSION
          Commit: $env:RELEASE_COMMIT
          Portable mode keeps settings, catalog, backups, logs and journal under .\data beside this executable.
          Keep the data directory beside the executable when replacing the app.
          The NexusBuild channel has no app updater. All network actions require an explicit user action.
          "@
            [IO.File]::WriteAllText((Join-Path $dir 'INSTRUCTIONS.txt'), $instructions, [Text.UTF8Encoding]::new($false))
            @{ channel = $Channel; version = $env:VERSION; commit = $env:RELEASE_COMMIT } |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir 'BUILD-PROVENANCE.json') -Encoding utf8
            @{ files = @($exeName, 'portable.flag', 'INSTRUCTIONS.txt', 'LICENSE', 'BUILD-PROVENANCE.json', 'PAYLOAD-CONTENTS.json') } |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir 'PAYLOAD-CONTENTS.json') -Encoding utf8
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath (Join-Path $release $OutputName)
          }

          New-Portable 'standard' 'DLSSync.exe' "DLSSync_$env:VERSION`_x64-portable.zip"
          New-Portable 'nexus' 'NexusBuild-DLSSync.exe' "NexusBuild-DLSSync_$env:VERSION`_x64-portable.zip"

      - name: Create Tauri updater signature for final Standard NSIS bytes
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD "release/DLSSync_$env:VERSION`_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Exact Standard installer missing before Tauri updater signing: $installer"
          }
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY)) {
            throw "Tauri updater signature missing for exact artifact $(Split-Path $installer -Leaf)"
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'dlssync-updater.key'
          [IO.File]::WriteAllText($keyPath, $env:PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          $env:TAURI_SIGNING_PRIVATE_KEY_PATH = $keyPath
          pnpm exec tauri signer sign $installer
          $signature = "$installer.sig"
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf) -or (Get-Item -LiteralPath $signature).Length -eq 0) {
            throw "Tauri updater signature missing for exact artifact $(Split-Path $installer -Leaf)"
          }
          Remove-Item -LiteralPath $keyPath -Force

      - name: Compose ordered release notes
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          AUTHENTICODE_STATE: ${{ steps.authenticode.outputs.state }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/extract-changelog-section.py $env:VERSION CHANGELOG.md | Set-Content changelog-section.md
          if (-not (Test-Path changelog-section.md) -or (Get-Item changelog-section.md).Length -lt 80) {
            throw "CHANGELOG.md section for $env:VERSION is missing or too short; refusing placeholder release notes"
          }
          $base = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG"
          if ($env:AUTHENTICODE_STATE -eq 'signed') {
            $signingNote = @"
          ## Signatures

          These Windows files are Authenticode-signed. Check the signature on the exact file you downloaded, and compare its SHA-256 with ``SHA256SUMS.txt``.
          The Standard updater payload carries a separate Tauri Ed25519 signature in ``latest.json``. The two checks are different.
          "@
          } elseif ($env:AUTHENTICODE_STATE -eq 'unsigned') {
            $signingNote = @"
          ## Signatures

          These Windows files are **not Authenticode-signed**. Windows shows an unknown-publisher warning on first run. That warning is correct, and this release does not ask you to turn off SmartScreen, Windows Defender or any other protection.
          Verify the exact file you downloaded against ``SHA256SUMS.txt`` before you run it.
          The Standard updater payload still carries its Tauri Ed25519 signature in ``latest.json``. That signature protects the update payload; it is not a Windows publisher signature.
          DLSSync still verifies the Authenticode publisher of every game DLL it downloads. That check is unchanged by this release's own signature state.
          "@
          } else {
            throw "Refusing release notes without a verified Authenticode state"
          }
          $header = @"
          ## Standard (recommended for GitHub users)

          - [NSIS installer]($base/DLSSync_$env:VERSION`_x64-setup.exe)
          - [MSI installer]($base/DLSSync_$env:VERSION`_x64_en-US.msi)
          - [Portable ZIP]($base/DLSSync_$env:VERSION`_x64-portable.zip)

          Standard includes the app updater. Portable mode uses manual executable replacement.

          ## NexusBuild (manual network actions)

          - [NSIS installer]($base/NexusBuild-DLSSync_$env:VERSION`_x64-setup.exe)
          - [MSI installer]($base/NexusBuild-DLSSync_$env:VERSION`_x64_en-US.msi)
          - [Portable ZIP]($base/NexusBuild-DLSSync_$env:VERSION`_x64-portable.zip)

          NexusBuild has no app updater. Network actions require an explicit user action.

          Common source commit: ``$env:RELEASE_COMMIT``

          "@
          $body = $header + "`n" + $signingNote + "`n`n" + (Get-Content changelog-section.md -Raw)
          [IO.File]::WriteAllText('release-body.md', $body, [Text.UTF8Encoding]::new($false))

      - name: Generate exact Standard latest.json and checksums
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          $pubDate = ([DateTimeOffset]::Parse((git show -s --format=%cI $env:RELEASE_COMMIT).Trim())).UtcDateTime.ToString('yyyy-MM-ddTHH:mm:ssZ')
          node scripts/release-safety.mjs latest --dir release --version $env:VERSION --tag $env:TAG --repository $env:REPOSITORY --notes release-body.md --pub-date $pubDate
          node scripts/release-safety.mjs checksums --dir release --version $env:VERSION
          node scripts/release-safety.mjs verify --dir release --version $env:VERSION

      - name: Create or resume release without destructive replacement
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          node scripts/publish-release.mjs --dir release --version $env:VERSION --tag $env:TAG --repository $env:REPOSITORY --commit $env:RELEASE_COMMIT --title "DLSSync v$env:VERSION" --notes release-body.md
